name: HealthSeq-NF Foundations Student Starter

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    name: Validate student starter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NXF_VER: "26.04.6"
      NXF_ANSI_LOG: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Validate starter structure
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/check_environment.sh

          test -s exercises/FOUNDATIONS_EXERCISES.md
          test -s exercises/PAPER_CONNECTION.md
          test ! -e exercises/FOUNDATIONS_ANSWER_KEY.md
          test ! -e docs/INSTRUCTOR_GUIDE.md

      - name: Run Lesson 1
        shell: bash
        run: |
          set -euo pipefail

          nextflow -C lessons/lesson.config run \
            lessons/01_hello_nextflow.nf

          output="$(
            find work \
              -name hello_nextflow.txt \
              -type f |
            head -n 1
          )"

          test -s "${output}"
          grep -qx "Hello from Nextflow" "${output}"

      - name: Confirm guided student tasks
        shell: bash
        run: |
          set -euo pipefail

          task_files=(
            lessons/02_process_inputs.nf
            lessons/03_channels_and_data_flow.nf
            lessons/04_parameters.nf
            lessons/05_small_pipeline.nf
          )

          for file in "${task_files[@]}"; do
            test -s "${file}"
            grep -q "STUDENT TASK" "${file}"
            echo "GUIDED: ${file}"
          done

      - name: Validate student documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            COURSE_START.md
            COURSE_PATH.md
            APPLIED_WORKSHOP.md
            lessons/01_first_nextflow.md
            lessons/02_process_inputs.md
            lessons/03_channels_and_data_flow.md
            lessons/04_parameters.md
            lessons/05_small_pipeline.md
            lessons/06_git_and_github.md
            lessons/07_prepare_for_applied.md
            exercises/FOUNDATIONS_EXERCISES.md
            exercises/PAPER_CONNECTION.md
          )

          for file in "${required_files[@]}"; do
            test -s "${file}"
            echo "OK: ${file}"
          done
